<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوتنامه عروسی مریم و میلاد</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:radial-gradient(
    circle at center,
    #fff9f5 0%,
    #f2ddd5 55%,
    #dfbeb3 100%
  );

  font-family:Tahoma,Arial,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;
}

.scene{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.envelope-wrap{
  width:min(92vw,430px);
  height:min(72vw,320px);
  position:relative;
  cursor:pointer;
  touch-action:manipulation;
}

.envelope{
  position:absolute;
  inset:0;
  border-radius:14px;

  background:linear-gradient(
    145deg,
    #f8e5dc,
    #dfb9aa
  );

  box-shadow:
    0 20px 50px rgba(80,45,40,.25);
}

.card{
  position:absolute;
  left:6%;
  width:88%;
  height:88%;
  bottom:4%;

  z-index:2;

  border-radius:8px;
  overflow:hidden;

  background:#fffaf5;

  box-shadow:
    0 8px 25px rgba(80,50,45,.2);

  transform:translateY(45px);
  opacity:.15;

  transition:
    transform .9s cubic-bezier(.2,.8,.2,1),
    opacity .5s ease;
}

.card img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.flap{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:63%;

  z-index:4;

  background:linear-gradient(
    160deg,
    #f8ded4,
    #e2b9ac
  );

  clip-path:polygon(
    0 0,
    100% 0,
    50% 100%
  );

  transform-origin:top center;

  transition:
    transform .9s cubic-bezier(.2,.8,.2,1);
}

.pocket{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:64%;

  z-index:5;

  background:linear-gradient(
    145deg,
    #f0d1c5,
    #dfb8aa
  );

  clip-path:polygon(
    0 0,
    50% 58%,
    100% 0,
    100% 100%,
    0 100%
  );

  border-radius:
    0 0 14px 14px;
}

.seal{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:60px;
  height:60px;

  border-radius:50%;

  z-index:6;

  background:#c99586;

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:26px;

  box-shadow:
    0 5px 16px rgba(80,45,40,.25);

  transition:
    opacity .4s ease,
    transform .5s ease;
}

.hint{
  position:absolute;

  top:calc(100% + 18px);
  left:50%;

  transform:translateX(-50%);

  white-space:nowrap;

  color:#684944;

  font-size:14px;

  opacity:.85;

  transition:opacity .4s;
}

.open .flap{
  transform:rotateX(180deg);
}

.open .card{
  transform:translateY(-38%);
  opacity:1;
  transition-delay:.2s;
}

.open .seal{
  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.5);
}

.open .hint{
  opacity:0;
}

@media(max-height:650px){

  .envelope-wrap{
    transform:scale(.84);
  }

}
</style>
</head>

<body>

<div class="scene">

  <div
    class="envelope-wrap"
    id="envelope"
    aria-label="برای باز کردن دعوتنامه لمس کنید"
  >

    <div class="envelope">

      <div class="card">

        <img
          src="دعوتنامه.png"
          alt="دعوتنامه عروسی مریم و میلاد"
        >

      </div>

      <div class="flap"></div>

      <div class="pocket"></div>

      <div class="seal">♥</div>

    </div>

    <div class="hint">
      برای باز کردن دعوتنامه لمس کنید
    </div>

  </div>

</div>

<script>

let opened = false;

document
.getElementById("envelope")
.addEventListener("pointerup", function(){

  if(opened) return;

  opened = true;

  this.classList.add("open");

});

</script>

</body>
</html>
