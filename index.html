<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوتنامه عروسی مریم و میلاد</title>
<style>
body{margin:0;background:#111;font-family:Tahoma,Arial;color:#fff}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{position:relative;width:min(430px,100%);overflow:hidden;border-radius:24px;box-shadow:0 20px 70px #000}.card img{width:100%;display:block}
.panel{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(20,14,10,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,215,150,.45);border-radius:18px;padding:13px;text-align:center}
button{border:0;cursor:pointer;background:linear-gradient(135deg,#f8e4ad,#c99a45);padding:11px 22px;border-radius:999px;font:inherit;font-weight:bold}.small{font-size:11px;opacity:.8;margin-top:7px}
</style></head><body><div class="wrap"><div class="card">
<img src="invitation.png" alt="دعوتنامه عروسی مریم و میلاد"><div class="panel">
<button id="musicBtn">🎵 پخش ماندگار</button><div class="small">با لمس دکمه، موسیقی داخل کارت پخش می‌شود.</div>
</div></div></div>
<audio id="music" src="Mandegar.mp3" preload="metadata"></audio>
<script>
const a=document.getElementById('music'),b=document.getElementById('musicBtn');
b.onclick=async()=>{if(a.paused){try{await a.play();b.textContent='⏸ توقف آهنگ'}catch(e){b.textContent='🎵 دوباره لمس کنید'}}else{a.pause();b.textContent='🎵 پخش ماندگار'}};
a.onended=()=>b.textContent='🎵 پخش دوباره';
</script></body></html>
