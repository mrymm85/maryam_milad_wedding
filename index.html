<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوتنامه عروسی مریم و میلاد</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111;font-family:Tahoma,Arial,sans-serif;color:#fff}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{position:relative;width:min(430px,100%);overflow:hidden;border-radius:24px;box-shadow:0 20px 70px #000;background:#222}
.card img{width:100%;display:block}
.panel{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(20,14,10,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,215,150,.45);border-radius:18px;padding:13px;text-align:center}
button,a{font:inherit}.music{display:inline-block;text-decoration:none;color:#24170b;background:linear-gradient(135deg,#f8e4ad,#c99a45);padding:10px 20px;border-radius:999px;font-weight:bold}
.small{font-size:11px;opacity:.8;margin-top:7px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<img src="invitation.png" alt="دعوتنامه عروسی مریم و میلاد">
<div class="panel">
<a class="music" href="https://open.spotify.com/track/4usfkrhP6YYBnZHxIYCmKK" target="_blank" rel="noopener">🎵 پخش «ماندگار» — شادمهر عقیلی</a>
<div class="small">با لمس دکمه، آهنگ در Spotify باز می‌شود.</div>
</div>
</div></div>
</body>
</html>
